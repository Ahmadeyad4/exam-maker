name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # رقم الإصدار = رقم التشغيل + 17 (حتى يكمل بعد 1.25: التشغيل 9 يصير 1.26)
      - name: Compute version number
        run: echo "NUM=$(( ${{ github.run_number }} + 17 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write version number
        run: |
          mkdir -p app/src/main/assets
          echo "$NUM" > app/src/main/assets/version.txt

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      # توقيع ثابت: نفس المفتاح كل مرة حتى أندرويد يقبل التحديث فوق القديم
      - name: Sign APK with fixed key
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ] || [ ! -f signing/release.jks.enc ]; then
            echo "::error::ناقص سر KEYSTORE_PASSWORD أو ما شغّلت Make signing key"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_PASS \
            -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --ks-key-alias exam \
            --out "exam-maker-v1.$NUM.apk" \
            app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --print-certs "exam-maker-v1.$NUM.apk" | head -3
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-maker-apk
          path: exam-maker-v1.${{ env.NUM }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ env.NUM }}
          name: Version 1.${{ env.NUM }}
          files: exam-maker-v1.${{ env.NUM }}.apk
