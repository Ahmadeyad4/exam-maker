name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # رقم الإصدار = رقم التشغيل + 17 (حتى يكمل بعد 1.25: التشغيل 9 يصير 1.26)
      - name: Compute version number
        run: echo "NUM=$(( ${{ github.run_number }} + 17 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write version number
        run: |
          mkdir -p app/src/main/assets
          echo "$NUM" > app/src/main/assets/version.txt

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "exam-maker-v1.$NUM.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-maker-apk
          path: exam-maker-v1.${{ env.NUM }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ env.NUM }}
          name: Version 1.${{ env.NUM }}
          files: exam-maker-v1.${{ env.NUM }}.apk
