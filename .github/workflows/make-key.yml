name: Make signing key (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create encrypted keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::error::ضيف سر KEYSTORE_PASSWORD أول"
            exit 1
          fi
          if [ -f signing/release.jks.enc ]; then
            echo "::error::المفتاح موجود من قبل. لا تسويه مرة ثانية لأن التحديثات راح تنكسر"
            exit 1
          fi
          mkdir -p signing
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 \
            -alias exam -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Exam Maker"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KS_PASS \
            -in "$RUNNER_TEMP/release.jks" -out signing/release.jks.enc
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Commit encrypted key
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signing/release.jks.enc
          git commit -m "Add encrypted signing key"
          git push
