<style>

.qt{margin:10px 0}

.mk{float:left;font-weight:700;border:1px solid #000;padding:0 8px;border-radius:4px;font-size:.9em}

</style>

<body>

<div id="s1" class="sc"><button class="big" data-m="q">📝<br>أسئلة امتحان</button><button class="big" data-m="b">📚<br>ملزمة</button></div>

<div id="ed">

<div><label>الزمن (اختياري)</label><input id="time"></div>
<div><label>المادة</label><input id="subj"></div>
<div><label>الصف</label><input id="grade"></div>

<div><label>اسم المعلم (يسار)</label><input id="teacher"></div>

<div class="card"><h3>الخطوط</h3><div id="fonts"></div></div>

<div><label>الخطوط بين الأسئلة</label><select id="ql"><option value="1px solid #000">عادية</option><option value="2px solid #000">سميكة</option><option value="1px dotted #000">منقطة</option><option value="0">بدون</option></select></div>
<div style="grid-column:1/3"><label>المسافة بين الأسئلة (قلّلها إذا الأسئلة كثيرة)</label><select id="qsp"><option value="0">واسعة</option><option value="1">متوسطة</option><option value="2">ضيقة</option><option value="3">ملاصقة</option></select></div>
</div></div>
<div class="card"><h3 id="qtitle">الأسئلة</h3>
<div id="qs"></div>
<div class="row" id="chips" style="display:none;margin-bottom:8px"></div><div class="row"><button class="btn o" id="add">+ سؤال جديد</button><label style="margin:0"><input type="checkbox" id="one" style="width:auto"> صفحة واحدة (ضبط الخط تلقائياً)</label><label style="margin:0;display:none" id="pnl"><input type="checkbox" id="pn" style="width:auto" checked> ترقيم الصفحات</label></div>

</div>
<div class="card row"><button class="btn" id="go">معاينة وطباعة</button><button class="btn x" id="rst">مسح كل شي</button></div>
</div>

<div id="prev">
<div class="row noprint" style="padding:0 10px 10px"><button class="btn" id="bpdf">⬇ PDF</button><button class="btn" id="bdoc">⬇ Word</button><button class="btn o" id="pr">🖨 طباعة</button></div>
<div id="wrap"><div id="paper"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
