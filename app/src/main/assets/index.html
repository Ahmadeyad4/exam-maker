<style>
:root{
--primary:#5B4BEA;--primary-light:#6F61EE;--secondary:#17163A;
--bg:#FAF8F3;--surface:#FFFFFF;--text:#17163A;--text2:#5A5878;
--error:#DC2626;--success:#16A34A;
--primary-d:color-mix(in srgb,var(--primary) 84%,#000);
--success-d:color-mix(in srgb,var(--success) 78%,#000);
--error-d:color-mix(in srgb,var(--error) 82%,#000);
--tint:color-mix(in srgb,var(--primary) 8%,#fff);
--tint2:color-mix(in srgb,var(--primary) 15%,#fff);
--line:color-mix(in srgb,var(--text2) 24%,#fff);
--line-p:color-mix(in srgb,var(--primary) 32%,#fff);
--n1:color-mix(in srgb,var(--text2) 8%,#fff);
--n2:color-mix(in srgb,var(--text2) 16%,#fff);
--n3:color-mix(in srgb,var(--text2) 26%,#fff);
--ok-t:color-mix(in srgb,var(--success) 10%,#fff);
--ok-t2:color-mix(in srgb,var(--success) 18%,#fff);
--er-t:color-mix(in srgb,var(--error) 8%,#fff);
--er-t2:color-mix(in srgb,var(--error) 15%,#fff);
--on-dark:rgba(255,255,255,.78);--on-dark-line:rgba(255,255,255,.2);--on-dark-fill:rgba(255,255,255,.12);
--lime:#C8F135;--coral:#FF6B4A;--ink:#17163A;--r-card:16px;--r-ctl:12px;
--shadow-card:0 1px 2px rgba(15,23,42,.05),0 8px 20px -8px rgba(15,23,42,.12);
}
html{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Cairo',system-ui,sans-serif;color:var(--text);background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.view{display:none;min-height:100%}.view.on{display:block}
.fa-solid{display:inline-block;width:1.2em;text-align:center;line-height:1}
/* header band: Secondary */
.hero{background:var(--secondary);color:#fff;box-shadow:0 2px 10px rgba(15,23,42,.18)}
.hero .in{max-width:980px;margin:0 auto;padding:26px 18px 24px}
.brand{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.logo{width:52px;height:52px;display:block;flex:none}.logo svg{display:block}
.logo .fa-solid{width:auto}
h1{font-family:'Reem Kufi','Cairo',sans-serif;font-size:46px;font-weight:700;margin:0;letter-spacing:-.5px;line-height:1.2}
.sub{color:var(--on-dark);margin:0;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:24px 18px 40px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:720px){.tiles{grid-template-columns:1fr}h1{font-size:34px}}
/* cards: 16px radius, 1px border, soft shadow */
.tile,.pr,.empty{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-card)}
.tile{font:inherit;text-align:right;cursor:pointer;padding:20px 18px 18px;position:relative;min-height:160px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover,.tile:focus-visible{border-color:var(--c);transform:translateY(-2px);box-shadow:0 2px 4px rgba(15,23,42,.06),0 14px 28px -10px rgba(15,23,42,.18);outline:none}
.tile:active{transform:translateY(0)}
.tile .ic{width:56px;height:56px;border-radius:18px;background:var(--c);display:grid;place-items:center;margin-bottom:8px;color:var(--ic,#fff)}.tile .ic svg{width:30px;height:30px}
.tile .ic .fa-solid{width:auto}
.tile b{font-size:22px;font-weight:800}
.tile span.d{color:var(--text2);font-size:14px;line-height:1.6}
.tile .cnt{position:absolute;top:14px;left:14px;background:var(--tint2);color:var(--primary);font-weight:800;font-size:13px;min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;padding:0 8px}
/* back button = secondary (inverse on the dark header) */
.bar{display:flex;align-items:center;gap:14px}
.bar h2{margin:0;font-size:24px;font-weight:900}
.back{font:inherit;font-weight:700;cursor:pointer;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:var(--r-ctl);padding:8px 14px;display:inline-flex;align-items:center;gap:8px}
.back:hover{background:var(--on-dark-fill)}
.back .fa-solid{width:auto}
.hero.slim .in{padding:16px 18px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pr{font:inherit;text-align:right;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-inline-start:4px solid var(--c);transition:border-color .15s,box-shadow .15s}
.pr:hover{border-color:var(--c);box-shadow:0 2px 4px rgba(15,23,42,.06),0 12px 24px -10px rgba(15,23,42,.16)}
.pr b{font-size:17px}.pr small{color:var(--text2)}
.tag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--ic,#fff);background:var(--c);border-radius:999px;padding:2px 10px}
.empty{grid-column:1/-1;padding:30px;text-align:center;color:var(--text2)}
.app{position:fixed;inset:0;display:none;background:var(--bg)}
.app.on{display:block}
.app iframe{width:100%;height:100%;border:0;display:block}
.app .miss{height:100%;display:grid;place-items:center;text-align:center;padding:24px;background:var(--bg);color:var(--text)}
/* floating home button = primary action */
.home-fab{position:fixed;z-index:9999;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:var(--secondary);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 16px;box-shadow:0 6px 18px rgba(15,23,42,.30);display:none;align-items:center;gap:8px}
.home-fab:hover{background:color-mix(in srgb,var(--secondary) 88%,#000)}
.home-fab .fa-solid{width:auto}
.home-fab.on{display:flex}
/* ===== معاينة وطباعة الصفحات على مستوى الصفحة الرئيسية ===== */
#ph{display:none}
body.ph-on #ph{display:block;position:fixed;inset:0;z-index:2147483000;overflow:auto;background:#475569;-webkit-overflow-scrolling:touch}
.phtb{position:sticky;top:0;z-index:2;display:flex;gap:10px;justify-content:center;padding:10px;background:#1e293b}
.phb{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:#a3e635;color:#1e293b}.phb.s{background:#fff}
.phpg{padding:12px 0 40px}
.phpg img{display:block;width:min(94%,640px);height:auto;margin:0 auto 12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
@media print{
@page{size:A4;margin:0}
html,body{height:auto!important;overflow:visible!important;background:#fff!important;margin:0!important}
body.ph-on>*:not(#ph){display:none!important}
body.ph-on #ph{position:static!important;overflow:visible!important;background:#fff!important}
.phtb{display:none!important}.phpg{padding:0}
.phpg img{width:210mm!important;height:297mm!important;max-width:none!important;margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always}
.phpg img:last-child{break-after:auto;page-break-after:auto}}
</style></head>

n=\"event.preventDefault(); applySelectionHighlight('#fef08a')\" class=\"w-5 h-5 rounded bg-yellow-200 border border-yellow-400\" title=\"تظليل أصفر\"><\/button>\n                        <button onmousedown=\"event.preventDefault(); applySelectionHighlight('#bbf7d0')\" class=\"w-5 h-5 rounded bg-green-200 border border-green-400\" title=\"تظليل أخضر\"><\/button>\n                        <button onmousedown=\"event.preventDefault(); applySelectionHighlight('#bae6fd')\" class=\"w-5 h-5 rounded bg-sky-200 border border-sky-400\" title=\"تظليل سماوي\"><\/button>\n                    <\/div>\n                    <button onclick=\"deselectActiveLessonBlock()\" class=\"text-indigo-300 hover:text-white px-1.5 py-0.5 rounded\">\n                        <i class=\"fa-solid fa-xmark\"><\/i>\n                    <\/button>\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <\u0021-- Tool Drawer -->\n        <div id=\"tool-drawer\" class=\"bg-white border-t border-slate-200 shadow-2xl px-4 py-3.5 z-30 shrink-0 transition-all hidden\">\n            <div class=\"max-w-4xl mx-auto\">\n                <div class=\"flex items-center justify-between mb-2.5 pb-1.5 border-b border-slate-100\">\n                    <span id=\"drawer-title\" class=\"text-xs font-extrabold text-indigo-800 flex items-center gap-1.5\"><\/span>\n                    <button onclick=\"closeToolDrawer()\" class=\"text-slate-400 hover:text-slate-700 p-1 rounded-lg\">\n                        <i class=\"fa-solid fa-xmark\"><\/i>\n                    <\/button>\n                <\/div>\n                <div id=\"drawer-content\" class=\"max-h-56 overflow-y-auto\"><\/div>\n            <\/div>\n        <\/div>\n\n        <\u0021-- Cover Bottom Bar -->\n        <div id=\"cover-bottom-bar\" class=\"bg-white border-t border-slate-200 px-2 py-2 shadow-lg z-30 shrink-0 hidden\">\n            <div class=\"max-w-4xl mx-auto flex items-center justify-around sm:justify-center sm:gap-4\">\n                <button onclick=\"openCoverDrawer('text')\" class=\"flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-indigo-50 text-slate-700 transition\">\n                    <div class=\"w-9 h-9 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-base\"><i class=\"fa-solid fa-font\"><\/i><\/div>\n                    <span class=\"text-[11px] font-bold\">نص وصور<\/span>\n                <\/button>\n                <button onclick=\"openCoverDrawer('frames')\" class=\"flex flex-col items-center gap-1 p-2 rounded-xl hover:bg-teal-50 text-slate-700 transition\">\n                    <div class=\"w-9 h-9 rounded-xl bg-teal-100 text-teal-700 flex items-center justify-center text-base\"><i class=\"fa-solid fa-border-all\"><\/i><\/div>\n                    <span class=\"text-[11px] font-bold\">إطارات وقوالب<\/span>\n                <\/button>\n                <button onclick=\"switchMode('lessons')\" class=\"flex flex-col items-center gap-1 p-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md transition\">\n                    <div class=\"w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-base\"><i class=\"fa-solid fa-arrow-left\"><\/i><\/div>\n                    <span class=\"text-[11px] font-extrabold\">صفحات الدروس<\/span>\n                <\/button>\n            <\/div>\n        <\/div>\n\n        <\u0021-- Lessons Bottom Bar -->\n        <div id=\"lessons-bottom-bar\" class=\"bg-white border-t border-slate-200 px-2 py-2 shadow-lg z-30 shrink-0\">\n            <div class=\"max-w-4xl mx-auto flex items-center justify-around sm:justify-center sm:gap-3 overflow-x-auto\">\n                <button onclick=\"openLessonDrawer('text')\" class=\"flex flex-col items-center gap-1 p-1.5 sm:p-2 rounded-xl hover:bg-indigo-50 text-slate-700 transition\">\n                    <div class=\"w-9 h-9 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-base\"><i class=\"fa-solid fa-heading\"><\/i><\/div>\n                    <span class=\"text-[11px] font-bold\">العناوين والنصوص<\/span>\n                <\/button>\n                <button onclick=\"openLessonDrawer('boxes')\" class=\"flex flex-col items-center gap-1 p-1.5 sm:p-2 rounded-xl hover:bg-blue-50 text-slate-700 transition\">\n                    <div class=\"w-9 h-9 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center text-base\"><i class=\"fa-solid fa-box-archive\"><\/i><\/div>\n                    <span class=\"text-[11px] font-bold\">القواعد<\/span>\n                <\/button>\n                <button onclick=\"openLessonDrawer('quiz')\" class=\"flex flex-col items-center gap-1 p-1.5 sm:p-2 rounded-xl hover:bg-emerald-50 text-slate-700 transition\">\n                    <div class=\"w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-base\"><i class=\"fa-solid fa-circle-question\"><\/i><\/div>\n                    <span class=\"text-[11px] font-bold\">الأسئلة<\/span>\n                <\/button>\n                <button onclick=\"openLessonDrawer('media')\" class=\"flex flex-col items-center gap-1 p-1.5 sm:p-2 rounded-xl hover:bg-indigo-50 text-slate-700 transition\">\n                    <div class=\"w-9 h-9 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-base\"><i class=\"fa-solid fa-images\"><\/i><\/div>\n                    <span class=\"text-[11px] font-bold\">صور وقوالب<\/span>\n                <\/button>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <\u0021-- Print Output Area -->\n    <div id=\"print-area\" class=\"hidden\"><\/div>\n\n    <script>\n        const STORAGE_KEY = 'malzama_pro_projects_v2';\n        let projects = [];\n        let currentProject = null;\n        let currentMode = 'cover';\n        let currentLessonPageIndex = 0;\n        let selectedCoverItemId = null;\n        let activeLessonBlockIndex = null;\n        let currentZoom = 0.88;\n\n        function createDefaultDemoProject() {\n            return {\n                id: 'demo-arabic-6th',\n                title: 'ملزمة قواعد اللغة العربية - السادس الإعدادي',\n                updatedAt: new Date().toLocaleDateString('ar-IQ'),\n                headerTeacher: 'الأستاذ: علي الوائلي',\n                headerSubject: 'أسلوب الاستفهام - المحاضرة الأولى',\n                footerNote: 'النجاح يبدأ بخطوة واثقة.. تمنياتي لكم بالمعدل العالي',\n                cover: {\n                    bgStyle: 'linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #c7d2fe 100%)',\n                    frame: 'frame-classic',\n                    items: [\n                        { id: 'c-1', type: 'text', x: 110, y: 185, width: 574, text: 'الوافي في قواعد اللغة العربية', fontFamily: 'Cairo', fontSize: 44, color: '#1e1b4b', align: 'center', bold: true },\n                        { id: 'c-2', type: 'text', x: 147, y: 750, width: 500, text: 'إعداد الأستاذ: علي الوائلي', fontFamily: 'Amiri', fontSize: 34, color: '#0f172a', align: 'center', bold: true, highlightColor: '#fef08a' }\n                    ]\n                },\n                pages: [\n                    {\n                        id: 'page-1',\n                        showHeaderFooter: true,\n                        blocks: [\n                            { id: 'b-h1', type: 'heading-main', content: 'الوحدة الأولى: أسلوب الاستفهام', fontFamily: 'Cairo', fontSize: 28, color: '#1e3a8a', align: 'right', bold: true },\n                            { id: 'b-h2', type: 'heading-sub', content: 'أولاً: تعريف الاستفهام وأدواته الأساسية', fontFamily: 'Cairo', fontSize: 21, color: '#0f766e', align: 'right', bold: true },\n                            { id: 'b-1', type: 'text', content: 'أسلوب الاستفهام — هو طلب يراد به الجواب عن شيء مجهول في ذهن المتكلم، ويتم بأحد أحرف أو أسماء الاستفهام.', fontFamily: 'Cairo', fontSize: 18, color: '#0f172a', align: 'right' },\n                            { id: 'b-list', type: 'list-bullet', items: ['حروف الاستفهام هما حرفان فقط: (الهمزة، وهل).', 'أسماء الاستفهام تسعة أسماء.'], fontFamily: 'Cairo', fontSize: 17, color: '#1e293b', align: 'right' },\n                            { id: 'b-rule', type: 'rule', title: 'قاعدة ذهبية (أنواع الاستفهام)', body: '1. الاستفهام التصديقي: يُجاب عنه بأحرف الجواب.\\n2. الاستفهام التصوري: يُجاب عنه بالتعيين.', fontFamily: 'Cairo', fontSize: 16, color: '#1e293b', align: 'right' }\n                        ]\n                    }\n                ]\n            };\n        }\n\n        function initStorage() {\n            const raw = localStorage.getItem(STORAGE_KEY);\n            if (raw) {\n                try { projects = JSON.parse(raw); } catch (e) { projects = [createDefaultDemoProject()]; }\n            } else {\n                projects = [createDefaultDemoProject()];\n                localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));\n            }\n            if (!currentProject && projects.length > 0) currentProject = projects[0];\n        }\n\n        function saveProjectsToStorage() {\n            if (currentProject) {\n                currentProject.updatedAt = new Date().toLocaleDateString('ar-IQ');\n                const idx = projects.findIndex(p => p.id === currentProject.id);\n                if (idx !== -1) projects[idx] = currentProject;\n            }\n            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); }\n            catch (e) { showToast('مساحة التخزين ممتلئة، صدّر نسخة احتياطية واحذف صوراً كبيرة', 'error'); }\n            recordHistory();\n        }\n\n        // ===== Undo / Redo =====\n        let hist = [], histIdx = -1, histApplying = false, histLastT = 0;\n        function resetHistory() {\n            hist = [JSON.stringify(currentProject)]; histIdx = 0; histLastT = 0; updateUndoButtons();\n        }\n        function recordHistory() {\n            if (histApplying || !currentProject || document.getElementById('editor-view').classList.contains('hidden')) return;\n            const snap = JSON.stringify(currentProject, (k, v) => k === 'updatedAt' ? undefined : v);\n            const cur = hist[histIdx] !== undefined ? JSON.stringify(JSON.parse(hist[histIdx]), (k, v) => k === 'updatedAt' ? undefined : v) : null;\n            if (snap === cur) return;\n            const full = JSON.stringify(currentProject), now = Date.now();\n            hist = hist.slice(0, histIdx + 1);\n            if (histIdx > 0 && now - histLastT < 700) hist[histIdx] = full;   // دمج الكتابة المتتابعة\n            else { hist.push(full); histIdx = hist.length - 1; }\n            if (hist.length > 60) { hist.shift(); histIdx = hist.length - 1; }\n            histLastT = now; updateUndoButtons();\n        }\n        function updateUndoButtons() {\n            const u = document.getElementById('undo-btn'), r = document.getElementById('redo-btn');\n            if (!u || !r) return;\n            u.disabled = histIdx <= 0; r.disabled = histIdx >= hist.length - 1;\n            u.classList.toggle('opacity-40', u.disabled); r.classList.toggle('opacity-40', r.disabled);\n        }\n        function stepHistory(dir) {\n            const t = histIdx + dir;\n            if (t < 0 || t >= hist.length) return;\n            histIdx = t; histLastT = 0; histApplying = true;\n            try {\n                const i = projects.findIndex(p => p.id === currentProject.id);\n                currentProject = JSON.parse(hist[t]);\n                if (i !== -1) projects[i] = currentProject;\n                localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));\n                currentLessonPageIndex = Math.min(currentLessonPageIndex, currentProject.pages.length - 1);\n                if (!currentProject.cover.items.some(x => x.id === selectedCoverItemId)) selectedCoverItemId = null;\n                deselectActiveLessonBlock();\n                document.getElementById('project-title-input').value = currentProject.title;\n                if (currentMode === 'cover') renderCoverCanvas(); else { renderLessonsPagesStrip(); renderCurrentLessonPage(); }\n            } catch (e) { console.error(e); }\n            histApplying = false; updateUndoButtons();\n        }\n        const undo = () => stepHistory(-1), redo = () => stepHistory(1);\n        document.addEventListener('keydown', e => {\n            if (!(e.ctrlKey || e.metaKey) || e.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;\n            if (e.key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }\n            else if (e.key === 'y') { e.preventDefault(); redo(); }\n        });\n\n        function showToast(message, type = 'success') {\n            const container = document.getElementById('toast-container');\n            const toast = document.createElement('div');\n            toast.className = `bg-slate-900 text-white border-emerald-500 border-r-4 px-4 py-3 rounded-xl shadow-xl text-sm font-bold flex items-center gap-2.5`;\n            toast.innerHTML = `<i class=\"fa-solid fa-circle-check text-emerald-400\"><\/i><span>${message}<\/span>`;\n            container.appendChild(toast);\n            setTimeout(() => toast.remove(), 2500);\n        }\n\n        function openModal({ title, desc, bodyHTML = '', confirmText = 'تأكيد', onConfirm }) {\n            const modal = document.getElementById('custom-modal');\n            document.getElementById('modal-title').textContent = title;\n            document.getElementById('modal-desc').textContent = desc;\n            document.getElementById('modal-body').innerHTML = bodyHTML;\n            const confirmBtn = document.getElementById('modal-confirm');\n            confirmBtn.textContent = confirmText;\n            modal.classList.remove('hidden');\n            modal.classList.add('flex');\n            const close = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };\n            document.getElementById('modal-cancel').onclick = close;\n            confirmBtn.onclick = () => { if (onConfirm) onConfirm(); close(); };\n        }\n\n\n/* ===== حفظ ملف موحّد: أندرويد -> Claude downloads -> رابط تنزيل ===== */\nasync function saveBlobFile(name,blob){\n  const W=[window];try{if(parent&&parent!==window)W.push(parent)}catch(e){}try{if(top&&top!==window&&top!==parent)W.push(top)}catch(e){}\n  for(const w of W){try{if(w.Android&&typeof w.Android.save==='function'){const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});w.Android.save(name,b64);return 'native'}}catch(e){}}\n  for(const w of W){try{if(w.claude&&w.claude.use){const d=await w.claude.use('downloads');if(d){await d.save({filename:name,data:blob});return 'saved'}}}catch(e){if(e&&e.code==='declined')return 'declined'}}\n  const ua=navigator.userAgent||'',mob=/Android|iPhone|iPad|iPod/i.test(ua)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform||''));\n  if(mob){try{const f=new File([blob],name,{type:blob.type||'application/octet-stream'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'shared'}}catch(e){if(e&&e.name==='AbortError')return 'declined'}}\n  try{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return 'anchor'}catch(e){}\n  return 'fail'}\n\n/* ===== طباعة عبر الصفحة الرئيسية (الأندرويد يطبع الصفحة الخارجية لا الإطار) ===== */\nclass Rec{constructor(o){this.pg=[[]];this.fs=10;Rec.last=this}\naddPage(){this.pg.push([])}\naddImage(d,f,x,y,w,h){this.pg[this.pg.length-1].push({t:'i',d,x,y,w,h})}\nsetFontSize(s){this.fs=s}\ntext(s,x,y,o){this.pg[this.pg.length-1].push({t:'t',s:String(s),x,y,fs:this.fs,a:o&&o.align})}\noutput(){const b=new Blob([''],{type:'application/pdf'});b.__rec=1;return b}\nasync render(){const W=1588,H=2246,k=W/210,out=[];for(const ops of this.pg){const c=document. ssonPage(); }\n\n        function selectActiveLessonBlock(idx) {\n            activeLessonBlockIndex = idx;\n            document.querySelectorAll('#lesson-blocks-container .lesson-block').forEach((el, i) => el.classList.toggle('active-block', i === idx));\n            document.getElementById('lesson-floating-format-bar').classList.remove('hidden');\n        }\n        function deselectActiveLessonBlock() {\n            activeLessonBlockIndex = null;\n            document.querySelectorAll('#lesson-blocks-container .lesson-block').forEach(el => el.classList.remove('active-block'));\n            document.getElementById('lesson-floating-format-bar').classList.add('hidden');\n        }\n\n        // ===== تنسيق على كلمات محددة أو على البلوك كله =====\n        let savedRange = null;\n        function editableOf(node) {\n            const el = node && (node.nodeType === 1 ? node : node.parentElement);\n            return el && el.closest ? el.closest('#lesson-blocks-container [contenteditable=\"true\"]') : null;\n        }\n        document.addEventListener('selectionchange', () => {\n            const sel = getSelection();\n            if (!sel.rangeCount) return;\n            const r = sel.getRangeAt(0), host = editableOf(r.commonAncestorContainer);\n            if (!host) return;                       // التحديد خارج النص (مثل شريط الأدوات): نحتفظ بالقديم\n            if (sel.isCollapsed) { savedRange = null; return; }\n            savedRange = r.cloneRange();\n            const blocks = [...document.querySelectorAll('#lesson-blocks-container .lesson-block')];\n            const i = blocks.indexOf(host.closest('.lesson-block'));\n            if (i !== -1 && i !== activeLessonBlockIndex) selectActiveLessonBlock(i);\n        });\n        // يرجع الحقل النصي إذا في كلمات محددة داخل البلوك النشط\n        function inlineHost() {\n            if (activeLessonBlockIndex === null || !savedRange) return null;\n            const w = document.querySelectorAll('#lesson-blocks-container .lesson-block')[activeLessonBlockIndex];\n            const host = editableOf(savedRange.commonAncestorContainer);\n            return (w && host && w.contains(host)) ? host : null;\n        }\n        function runInline(cmd, val) {\n            const host = inlineHost(); if (!host) return false;\n            host.focus();\n            const sel = getSelection(); sel.removeAllRanges(); sel.addRange(savedRange);\n            document.execCommand(cmd, false, val);\n            host.dispatchEvent(new Event('input', { bubbles: true }));   // للحفظ\n            return true;\n        }\n        function inlineFontSize(delta) {\n            const host = inlineHost(); if (!host) return false;\n            const base = parseFloat(getComputedStyle(editableOf(savedRange.startContainer) || host).fontSize) || 18;\n            const px = Math.min(60, Math.max(10, Math.round(base + delta)));\n            host.focus();\n            const sel = getSelection(); sel.removeAllRanges(); sel.addRange(savedRange);\n            document.execCommand('fontSize', false, '7');\n            host.querySelectorAll('font[size=\"7\"]').forEach(f => {\n                const sp = document.createElement('span'); sp.style.fontSize = px + 'px';\n                while (f.firstChild) sp.appendChild(f.firstChild);\n                f.replaceWith(sp);\n            });\n            host.dispatchEvent(new Event('input', { bubbles: true }));\n            return true;\n        }\n\n        function formatScript(cmd) {\n            if (!runInline(cmd)) showToast('حدد كلمات داخل النص أولاً', 'error');\n        }\n        function clearActiveFormat() {\n            if (activeLessonBlockIndex === null) return;\n            const host = inlineHost();\n            if (host) {\n                runInline('removeFormat');\n                const sel = getSelection();\n                host.querySelectorAll('span[style],font,b,i,u,strong,em,sub,sup').forEach(el => {\n                    if (!sel.containsNode(el, true)) return;\n                    while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);\n                    el.remove();\n                });\n                host.dispatchEvent(new Event('input', { bubbles: true }));\n                return;\n            }\n            const b = currentProject.pages[currentLessonPageIndex].blocks[activeLessonBlockIndex], d = makeLessonBlock(b.type);\n            ['fontFamily', 'fontSize', 'color', 'align', 'bold'].forEach(k => b[k] = d[k]);\n            delete b.italic; delete b.underline; delete b.lh; delete b.mt; delete b.dir; delete b.bg;\n            saveProjectsToStorage(); renderCurrentLessonPage(); selectActiveLessonBlock(activeLessonBlockIndex);\n        }\n        function toggleBlockDir() {\n            if (activeLessonBlockIndex === null) return;\n            const b = currentProject.pages[currentLessonPageIndex].blocks[activeLessonBlockIndex];\n            b.dir = b.dir === 'ltr' ? 'rtl' : 'ltr';\n            if (b.dir === 'ltr' && (!b.align || b.align === 'right')) b.align = 'left';\n            else if (b.dir === 'rtl' && b.align === 'left') b.align = 'right';\n            saveProjectsToStorage(); renderCurrentLessonPage(); selectActiveLessonBlock(activeLessonBlockIndex);\n        }\n        function setBlockBg(c) {\n            if (activeLessonBlockIndex === null) return;\n            const b = currentProject.pages[currentLessonPageIndex].blocks[activeLessonBlockIndex];\n            if (c) b.bg = c; else delete b.bg;\n            saveProjectsToStorage(); renderCurrentLessonPage(); selectActiveLessonBlock(activeLessonBlockIndex);\n        }\n        function adjustSpacing(kind, d) {\n            if (activeLessonBlockIndex === null) return;\n            const b = currentProject.pages[currentLessonPageIndex].blocks[activeLessonBlockIndex];\n            if (kind === 'lh') b.lh = Math.min(3, Math.max(1, +((b.lh || 1.6) + d).toFixed(1)));\n            else b.mt = Math.min(80, Math.max(0, (b.mt || 0) + d));\n            saveProjectsToStorage(); renderCurrentLessonPage(); selectActiveLessonBlock(activeLessonBlockIndex);\n        }\n        function updateActiveLessonBlockStyle(prop, val) {\n            if (activeLessonBlockIndex === null) return;\n            if (prop === 'color' && runInline('foreColor', val)) return;\n            if (prop === 'fontFamily' && runInline('fontName', val)) return;\n            currentProject.pages[currentLessonPageIndex].blocks[activeLessonBlockIndex][prop] = val;\n            saveProjectsToStorage(); renderCurrentLessonPage(); selectActiveLessonBlock(activeLessonBlockIndex);\n        }\n        function adjustActiveLessonBlockFontSize(delta) {\n            if (activeLessonBlockIndex === null) return;\n            if (inlineFontSize(delta)) return;\n            const b = currentProject.pages[currentLessonPageIndex].blocks[activeLessonBlockIndex];\n            b.fontSize = Math.min(48, Math.max(12, (b.fontSize || 18) + delta));\n            saveProjectsToStorage(); renderCurrentLessonPage(); selectActiveLessonBlock(activeLessonBlockIndex);\n        }\n        function toggleActiveLessonBlockProp(prop) {\n            if (activeLessonBlockIndex === null) return;\n            const cmd = { bold: 'bold', italic: 'italic', underline: 'underline' }[prop];\n            if (cmd && runInline(cmd)) return;\n            const b = currentProject.pages[currentLessonPageIndex].blocks[activeLessonBlockIndex];\n            b[prop] = !b[prop];\n            saveProjectsToStorage(); renderCurrentLessonPage(); selectActiveLessonBlock(activeLessonBlockIndex);\n        }\n\n        function openLessonDrawer(tool) {\n            const drawer = document.getElementById('tool-drawer');\n            drawer.classList.remove('hidden');\n            const B = 'px-3 py-2 rounded-xl font-bold text-xs ';\n            const content = document.getElementById('drawer-content');\n            if (tool === 'text') {\n                document.getElementById('drawer-title').textCont eq() + 1);\n\n            const curSeq = () => currentMode === 'cover' ? 0 : currentLessonPageIndex + 1;\n            const total = () => (currentProject ? currentProject.pages.length : 0) + 1;\n\n            function layoutFloating() {\n                const r = vp.getBoundingClientRect();\n                if (!r.width) return;\n                const bottom = (window.innerHeight - r.bottom);\n                drawer.style.left = r.left + 'px'; drawer.style.width = r.width + 'px'; drawer.style.bottom = bottom + 'px';\n                pager.style.left = (r.left + r.width / 2) + 'px'; pager.style.bottom = (bottom + 10 + (drawer.classList.contains('hidden') ? 0 : drawer.offsetHeight)) + 'px';\n                pager.style.display = 'flex';\n            }\n            function updatePager() {\n                if (!currentProject) return;\n                const i = curSeq(), n = total();\n                pager.querySelector('#pager-label').textContent = i === 0 ? 'الغلاف' : `صفحة ${i} / ${n - 1}`;\n                prevBtn.disabled = i <= 0; nextBtn.disabled = i >= n - 1;\n                layoutFloating();\n            }\n\n            window.goPage = function (i, silent) {\n                const n = total();\n                i = Math.max(0, Math.min(n - 1, i));\n                const from = curSeq();\n                if (i === from) return;\n                closeToolDrawer();\n                if (i === 0) switchMode('cover');\n                else { currentLessonPageIndex = i - 1; if (currentMode !== 'lessons') switchMode('lessons'); else selectLessonPage(i - 1); }\n                vp.scrollTop = 0; vp.scrollLeft = 0;\n                if (!userZoomed) fitZoom();\n                updatePager();\n                const w = document.getElementById(i === 0 ? 'cover-canvas-wrapper' : 'lesson-canvas-wrapper');\n                if (w && w.animate) w.animate([{ transform: `translateX(${i > from ? -50 : 50}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 200, easi div');\n                tile.className = 'pm-tile' + (i === cur ? ' pm-current' : ''); tile.dataset.i = i;\n                const th = document.createElement('div'); th.className = 'pm-thumb';\n                const inner = document.createElement('div'); inner.appendChild(sh); th.appendChild(inner);\n                const lb = document.createElement('div'); lb.className = 'pm-label'; lb.textContent = i === 0 ? 'الغلاف' : 'صفحة ' + i;\n                tile.appendChild(th); tile.appendChild(lb);\n                if (i > 0) {\n                    const g = document.createElement('div'); g.className = 'pm-grip'; g.title = 'اسحب لنقل الصفحة';\n                    g.innerHTML = '<i class=\"fa-solid fa-grip-vertical\"><\/i>';\n                    g.addEventListener('pointerdown', ev => startPageDrag(ev, i - 1, tile));\n                    g.addEventListener('click', ev => ev.stopPropagation());\n                    tile.appendChild(g);\n                }\n                tile.addEventListener('click', () => { closePagesManager(); goPage(i); });\n                grid.appendChild(tile);\n                inner.style.zoom = (th.clientWidth || 150) / 794;\n            });\n            document.getElementById('pm-count').textContent = sheets.length + ' ورقة';\n        }\n        function startPageDrag(e, from, tile) {\n            e.preventDefault(); e.stopPropagation();\n            const grid = document.getElementById('pm-grid'), sc = document.getElementById('pm-scroll');\n            const tiles = [...grid.children], r = tile.getBoundingClientRect();\n            const ghost = tile.cloneNode(true);\n            ghost.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;z-index:95;pointer-events:none;opacity:.92;transform:rotate(3deg) scale(1.04);`;\n            document.body.appendChild(ghost);\n            const ox = e.clientX - r.left, oy = e.clientY - r.top;\n            tile.style.opacity = '.3';\n            let x = e.clientX, y = e.clientY, nly-child),.eye .fa-solid,.tabs button .fa-solid:not(:only-child),.pgc .bg .fa-solid{margin-inline-end:.35em;width:auto}\n.btn .fa-solid:only-child,.tabs button .fa-solid:only-child{margin:0}\n.btn.s .fa-solid:last-child:not(:only-child){margin-inline-end:0;margin-inline-start:.35em}\n.qh1 .fa-solid,.plh .fa-solid,.pgh .fa-solid,.card h3 .fa-solid,#s-info b .fa-solid{margin-inline-end:.35em;width:auto}\n.pgmk .fa-solid,.pgap .fa-solid{width:auto;font-size:.8em;margin:0 .25em}\n@media print{body{background-image:none!important}.card,.mi{box-shadow:none}}\n<\/style>\n<style id=\"brs-css\">\n.br{display:flex;gap:6px;align-items:flex-start;padding-inline-start:28px}.br .bn{flex:none}.br .bt{flex:1;min-width:0}.ctr .br{padding:0;justify-content:center}\n.brs{margin-top:10px}\n.brx{border:1px solid var(--line);border-inline-start:4px solid var(--primary);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--bg)}\n.brh{display:flex;align-items:center;gap:6px;margin-bottom:6px}.brh .hint{flex:none;margin:0}.brh .brn{flex:1;min-width:0;font-weight:700}\n.brh .brd{flex:none;padding:6px 9px}\n.brx .brt{min-height:56px}\n.bradd{margin-top:2px}\n@media print{.qt:has(>.br){break-inside:auto}.qt .br{break-inside:avoid}.qt .qh2{break-after:avoid}}\n<\/style>\n<\/head>\n<body>\n<div id=\"start\"><h2 id=\"sh\">شنو تريد تسوي؟<\/h2>\n<div id=\"s1\" class=\"sc\"><button class=\"big\" data-m=\"q\"><i class=\"fa-solid fa-file-pen\"><\/i><br>أسئلة امتحان<\/button><\/div>\n\n<div id=\"pbox\"><div id=\"ph\" style=\"display:none\"><h3 style=\"margin:6px 0\">أوراقي المحفوظة<\/h3><div id=\"plist\"><\/div><\/div>\n<div class=\"sc\" style=\"margin-top:10px\"><button class=\"btn o s\" id=\"bex\"><i class=\"fa-solid fa-floppy-disk\"><\/i> حفظ نسخة احتياطية<\/button><button class=\"btn o s\" id=\"bim\"><i class=\"fa-solid fa-folder-open\"><\/i> استرجاع نسخة<\/button><input type=\"file\" id=\"bf\" accept=\".json,application/json\" style=\"display:none\"><\/div><\/div><\/div>\n<div class=\"tabs\"><button id=\"t0\" style=\"flex:.35\"><i class=\"fa-solid fa-house\"><\/i><\/button><button id=\"t1\" class=\"on\"><i class=\"fa-solid fa-pen\"><\/i> تحرير<\/button><button id=\"t2\"><i class=\"fa-solid fa-eye\"><\/i> معاينة<\/button><div id=\"live\"><div class=\"lh\"><b><i class=\"fa-solid fa-eye\"><\/i> معاينة مباشرة<\/b><span style=\"display:flex;gap:4px\"><button class=\"btn o\" id=\"lm\"><i class=\"fa-solid fa-minus\"><\/i><\/button><button class=\"btn o\" id=\"lp\"><i class=\"fa-solid fa-plus\"><\/i><\/button><button class=\"btn o\" id=\"lt\">إخفاء<\/button><\/span><\/div><div id=\"livebox\"><\/div><\/div><\/div>\n\n<div id=\"ed\">\n<div style=\"margin:0 10px 8px\"><label>اسم الورقة (يظهر بقائمة أوراقي)<\/label><input id=\"pname\" placeholder=\"مثلاً: شهر ثاني - خامس\"><\/div>\n<div id=\"menu\">\n<button class=\"mi\" data-s=\"info\" id=\"mi-info\"><span class=\"ic\"><i class=\"fa-solid fa-school\"><\/i><\/span><span>معلومات الورقة<small>شكل الترويسة وحجمها (كاملة / سطر واحد / مكان اسم الطالب والقاعة والمدرسة فقط)، إخفاء أي عنصر، اسم المدرسة، العنوان، المادة، الصف، المعلم، عبارة نهاية الورقة<\/small><\/span><\/button>\n<button class=\"mi\" data-s=\"hf\" id=\"mi-hf\" style=\"display:none\"><span class=\"ic\"><i class=\"fa-solid fa-file-lines\"><\/i><\/span><span>الترويسة والغلاف<small>ترويسة وتذييل ثابت للصفحات (اسم الأستاذ، المادة، الصف، الهاتف) وصفحة غلاف جاهزة<\/small><\/span><\/button>\n<button class=\"mi\" data-s=\"qs\" id=\"mi-qs\"><span class=\"ic\"><i class=\"fa-solid fa-file-pen\"><\/i><\/span><span><span id=\"mi-qt\">الأسئلة<\/span><small id=\"mi-qd\">الأسئلة ومحتواها وترقيمها وترتيبها<\/small><\/span><\/button>\n<button class=\"mi\" data-s=\"fonts\" id=\"mi-fonts\"><span class=\"ic\"><i class=\"fa-solid fa-font\"><\/i><\/span><span>الخطوط<small id=\"mi-fd\">نوع الخط وقوته وحجمه، والخطوط الفاصلة والمسافات<\/small><\/span><\/button>\n<button class=\"mi\" data-s=\"pages\" id=\"mi-pages\" style=\"display:none;grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px\"><span class=\"ic\"><i class=\"fa-solid fa-file\"><\/i><\/span><span>صفحات الملزمة (تعديل كل صفحة وأسطرها)<small>اختر أي صفحة وعدّل نص كل سطر ومحاذاته ونوع خطه وحجمه<\/small><\/span><\/button>\n<div class=\"card row\"><button class=\"btn\" id=\"go\">معاينة وطباعة<\/button><button class=\"btn x\" id=\"rst\">مسح كل شي<\/button><\/div>\n<\/div>\n<div class=\"sec\" id=\"s-info\"><div class=\"sbar\"><button class=\"btn o bk\"><i class=\"fa-solid fa-arrow-right\"><\/i> رجوع للقائمة<\/button><\/div>\n<div class=\"card\" id=\"chd\"><h3>شكل الترويسة وحجمها<\/h3>\n<label>شكل أعلى الورقة<\/label>\n<select id=\"hmode\"><option value=\"full\">كاملة (ثلاثة أعمدة - الشكل الحالي)<\/option><option value=\"line\">سطر واحد مضغوط (كل المعلومات بصف واحد)<\/option><option value=\"stu\">فقط مكان اسم الطالب والقاعة والمدرسة (سطر واحد)<\/option><option value=\"none\">بدون ترويسة نهائياً<\/option><\/select>\n<div id=\"vA\" style=\"margin-top:10px\"><label>العناصر الظاهرة بالترويسة (شيل العلامة لحذف العنصر)<\/label>\n<div class=\"chk\"><label><input type=\"checkbox\" id=\"v_school\" checked> اسم المدرسة<\/label><label><input type=\"checkbox\" id=\"v_logo\" checked> الشعار<\/label><label><input type=\"checkbox\" id=\"v_kind\" checked> عنوان الامتحان<\/label><label><input type=\"checkbox\" id=\"v_year\" checked> العام الدراسي<\/label><label><input type=\"checkbox\" id=\"v_subj\" checked> المادة<\/label><label><input type=\"checkbox\" id=\"v_grade\" checked> الصف<\/label><label><input type=\"checkbox\" id=\"v_time\" checked> الزمن<\/label><\/div><\/div>\n<div id=\"vB\" style=\"margin-top:10px\"><label>يطلع سطر واحد بخطوط للكتابة باليد (إذا كتبت اسم المدرسة بالأسفل يطلع مكتوب بدل الخط)<\/label>\n<div class=\"chk\"><label><input type=\"checkbox\" id=\"v_stu\" checked> اسم الطالب<\/label><label><input type=\"checkbox\" id=\"v_hall\" checked> اسم القاعة<\/label><label><input type=\"checkbox\" id=\"v_sch\" checked> المدرسة<\/label><\/div><\/div>\n<div id=\"vS\" style=\"margin-top:6px\"><label>حجم الترويسة: <b id=\"hszv\">100<\/b>%<\/label><input type=\"range\" id=\"hsz\" min=\"40\" max=\"130\" step=\"5\" value=\"100\"><\/div>\n<div style=\"margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px\"><div class=\"chk\" style=\"display:none\"><label><input type=\"checkbox\" id=\"v_tl\" checked> المعلم (يسار)<\/label><label><input type=\"checkbox\" id=\"v_tl2\" checked> المعلم الثاني (يمين)<\/label><label><input type=\"checkbox\" id=\"v_wish\" checked> عبارة نهاية الورقة<\/label><\/div>\n<label>حجم أسفل الورقة: <b id=\"fszv\">100<\/b>%<\/label><input type=\"range\" id=\"fsz\" min=\"40\" max=\"130\" step=\"5\" value=\"100\"><\/div>\n<\/div>\n<div class=\"card\" id=\"cinfo\"><h3>معلومات الورقة<\/h3>\n<div class=\"grid\">\n<div style=\"grid-column:1/3\"><label>اسم المدرسة (يمين الورقة)<\/label><input id=\"school\"><\/div>\n<div style=\"grid-column:1/3\"><label>عنوان الامتحان (وسط الورقة)<\/label><input id=\"kind\"><\/div>\n<div><label>العام الدراسي<\/label><input id=\"year\"><\/div>\n<div><label>الزمن (اختياري)<\/label><input id=\"time\"><\/div>\n<div><label>المادة<\/label><input id=\"subj\"><\/div>\n<div><label>الصف<\/label><input id=\"grade\"><\/div>\n<div><label>صفة المعلم (يسار الورقة)<\/label><input id=\"teachl\"><\/div>\n<div><label>اسم المعلم (يسار)<\/label><input id=\"teacher\"><\/div>\n<div><label>صفة معلم ثاني (يمين الورقة)<\/label><input id=\"teachl2\"><\/div>\n<div><label>اسم المعلم الثاني (يمين)<\/label><input id=\"teacher2\"><\/div>\n<div style=\"grid-column:1/3\"><label>عبارة نهاية الورقة<\/label><input id=\"wish\"><\/div>\n<\/div>\n<div class=\"row\" style=\"margin-top:8px\"><label style=\"margin:0\">شعار المدرسة:<\/label><input type=\"file\" id=\"logo\" accept=\"image/*\" style=\"flex:1\"><\/div>\n<\/div>\n\n<\/div>\n<div class=\"sec\" id=\"s-hf\"><div class=\"sbar\"><button class=\"btn o bk\"><i class=\"fa-solid fa-arrow-right\"><\/i> رجوع للقائمة<\/button><\/div>\n<div class=\"card\" id=\"chf\"><h3>ترويسة وتذييل الصفحات<\/h3>\n<div class=\"grid\">\n<div style=\"grid-column:1/3\"><label>مكان الظهور<\/label><select id=\"hfPos\"><option value=\"none\">بدون<\/option><option value=\"top\">أعلى كل صفحة<\/option><option value=\"bottom\">أسفل كل صفحة<\/option><option value=\"both\">أعلى وأسفل (العنوان فوق والباقي تحت)<\/option><\/select><\/div>\n<div style=\"grid-column:1/3\"><label>عنوان الملزمة<\/label><input id=\"hfK\"><\/div>\n<div><label>اسم الأستاذ<\/label><input id=\"hfT\"><\/div>\n<div><label>المادة<\/label><input id=\"hfS\"><\/div>\n<div><label>الصف<\/label><input id=\"hfG\"><\/div>\n<div><label>رقم الهاتف أو قناة التلغرام<\/label><input id=\"hfP\" dir=\"ltr\" placeholder=\"@channel أو 07xxxxxxxxx\"><\/div>\n<\/div>\n<p class=\"hint\">هذي المعلومات تطلع بشكل مرتب أعلى و/أو أسفل كل صفحة. ترقيم الصفحات يبقى من تبويب «محتوى الملزمة».<\/p><\/div>\n<div class=\"card\" id=\"ccv\"><h3>صفحة الغلاف<\/h3>\n<div class=\"grid\">\n<div style=\"grid-column:1/3\"><label>الغلاف<\/label><select id=\"cvOn\"><option value=\"0\">بدون غلاف<\/option><option value=\"1\">غلاف جاهز بأول الملزمة<\/option><\/select><\/div>\n<div><label>السنة الدراسية<\/label><input id=\"cvY\" placeholder=\"2026 - 2027\"><\/div>\n<div><label>نص أسفل الغلاف (اختياري)<\/label><input id=\"cvN\"><\/div>\n<\/div>\n<div class=\"row\" style=\"margin-top:8px\"><label style=\"margin:0\">الشعار:<\/label><input type=\"file\" id=\"logo2\" accept=\"image/*\" style=\"flex:1\"><\/div>\n<p class=\"hint\">الغلاف يستخدم عنوان الملزمة واسم الأستاذ والمادة والصف والهاتف من الخانات فوق. الغلاف ما ينرقّم وما تطلع عليه الترويسة.<\/p><\/div>\n<div class=\"card\" id=\"ctp\"><h3>قالب الأستاذ<\/h3>\n<div class=\"row\"><button class=\"btn o\" id=\"tpS\"><i class=\"fa-solid fa-floppy-disk\"><\/i> حفظ كقالب<\/button><button class=\"btn o\" id=\"tpA\"><i class=\"fa-solid fa-file-import\"><\/i> تطبيق القالب<\/button><button class=\"btn x\" id=\"tpD\">حذف القالب<\/button><\/div>\n<p class=\"hint\" id=\"tpH\"><\/p><\/div>\n<\/div>\n<div class=\"sec\" id=\"s-fonts\"><div class=\"sbar\"><button class=\"btn o bk\"><i class=\"fa-solid fa-arrow-right\"><\/i> رجوع للقائمة<\/button><\/div>\n<div class=\"card\"><h3>الخطوط<\/h3><div id=\"fsw\" style=\"margin-bottom:10px\"><label>اختر العنصر الذي تريد تعدّل خطه<\/label><select id=\"fsel\"><option value=\"H\">الترويسة<\/option><option value=\"Q\" selected>الأسئلة<\/option><option value=\"W\">عبارة نهاية الأسئلة<\/option><option value=\"T\">صفة المعلم واسمه<\/option><\/select><\/div><div id=\"fonts\"><\/div><\/div>\n<div class=\"card\" id=\"cpg\"><h3>تعديل صفحة محددة فقط<\/h3>\n<div class=\"grid\"><div style=\"grid-column:1/3\"><label>الصفحة<\/label><select id=\"pgSel\"><\/select><\/div>\n<div><label>نوع الخط<\/label><select id=\"pgFf\"><\/select><\/div><div><label>قوة الخط<\/label><select id=\"pgFw\"><\/select><\/div>\n<div><label>حجم الخط<\/label><input type=\"number\" id=\"pgFs\" min=\"8\" max=\"48\" placeholder=\"بدون تغيير\"><\/div><div><label>لون الكتابة<\/label><select id=\"pgCl\"><\/select><\/div><\/div>\n<div class=\"row\" style=\"margin-top:8px\"><button class=\"btn\" id=\"pgOk\">تطبيق على هذي الصفحة فقط<\/button><button class=\"btn x\" id=\"pgRs\">إزالة تعديلات الصفحة<\/button><button class=\"btn x\" id=\"pgRa\">إزالة تعديلات كل الصفحات<\/button><\/div>\n<p class=\"hint\" id=\"pgH\"><\/p><\/div>\n<div class=\"card\" id=\"csep\"><h3>الخطوط الفاصلة والمسافات<\/h3><div class=\"grid\">\n<div><label>الخط تحت الترويسة<\/label><select id=\"hl\"><option value=\"1px solid #000\">عادي<\/option><option value=\"2px solid #000\">سميك<\/option><option value=\"1px dotted #000\">منقط<\/option><option value=\"0\">بدون<\/option><\/select><\/div>\n<div><label>الخطوط بين الأسئلة<\/label><select id=\"ql\"><option value=\"1px solid #000\">عادية<\/option><option value=\"2px solid #000\">سميكة<\/option><option value=\"1px dotted #000\">منقطة<\/option><option value=\"0\">بدون<\/option><\/select><\/div>\n<div style=\"grid-column:1/3;border-top:1px dashed var(--bd);padding-top:8px\"><label style=\"display:flex;align-items:center;gap:6px;font-size:14px;color:var(--tx);margin:0 0 8px\"><input type=\"checkbox\" id=\"v_hl\" checked style=\"width:auto;padding:0\"> إبقاء الخط الفاصل بين الترويسة والأسئلة (شيل العلامة لحذفه)<\/label><label>تحريك الخط: <b id=\"hlpv\">0<\/b> (سالب = لفوق، موجب = لتحت)<\/label><input type=\"range\" id=\"hlp\" min=\"-20\" max=\"40\" step=\"2\" value=\"0\"><\/div>\n<div style=\"grid-column:1/3\"><label>المسافة بين الأسئلة (قلّلها إذا الأسئلة كثيرة)<\/label><select id=\"qsp\"><option value=\"0\">واسعة<\/option><option value=\"1\">متوسطة<\/option><option value=\"2\">ضيقة<\/option><option value=\"3\">ملاصقة<\/option><\/select><\/div>\n<\/div><\/div>\n<\/div>\n<div class=\"sec\" id=\"s-qs\"><div class=\"sbar\"><button class=\"btn o bk\"><i class=\"fa-solid fa-arrow-right\"><\/i> رجوع للقائمة<\/button><\/div>\n<div class=\"card\" id=\"qinf\"><div class=\"row\" style=\"justify-content:space-between\"><b style=\"color:var(--ac);font-size:15px\"><i class=\"fa-solid fa-clipboard-list\"><\/i> معلومات الورقة والترويسة<\/b><span class=\"row\"><button type=\"button\" class=\"btn s\" id=\"qiB\" style=\"padding:5px 12px;font-size:13px\"><i class=\"fa-solid fa-pen\"><\/i> تعديل<\/button><\/span><\/div><div class=\"qsm\" id=\"qiS\"><\/div><\/div>\n<div class=\"card\"><h3 id=\"qtitle\">الأسئلة<\/h3>\n<div style=\"margin-bottom:10px\"><label>شكل الأرقام (الدرجات والترقيم)<\/label><select id=\"dg\"><option value=\"\">تلقائي حسب لغة الورقة<\/option><option value=\"ar\">عربية ١ ٢ ٣<\/option><option value=\"en\">إنجليزية 1 2 3<\/option><\/select><\/div>\n<div id=\"qs\"><\/div>\n<div id=\"qaWrap\" style=\"display:none;margin:0 0 8px\"><label>الإجابات (لكتل «سؤال وجواب»)<\/label><select id=\"qaHide\"><option value=\"show\">ظاهرة (نسخة المعلم)<\/option><option value=\"line\">مخفية مع خط للكتابة (نسخة الطالب)<\/option><option value=\"none\">مخفية بدون أثر<\/option><\/select><\/div>\n<div class=\"row\" id=\"chips\" style=\"display:none;margin-bottom:8px\" <script>
/* مفاتيح التخزين: الملزمة malzama_pro_projects_v2 والأسئلة ex_papers (نوع q فقط) */
const KEYS={m:'malzama_pro_projects_v2',q:'ex_papers'};
const NAMES={m:'ملزمة',q:'أسئلة'},COL={m:'var(--primary)',q:'var(--coral)'},ICC={m:'#fff',q:'var(--ink)'};
const $=id=>document.getElementById(id);
function __topPrint(urls){const ph=$('ph');ph.innerHTML='<div class="phtb"><button class="phb" id="phgo">طباعة / حفظ PDF</button><button class="phb s" id="phx">إغلاق</button></div><div class="phpg"></div>';
const box=ph.querySelector('.phpg');urls.forEach(u=>{const im=new Image();im.alt='';im.src=u;box.appendChild(im)});
$('phx').onclick=()=>{document.body.classList.remove('ph-on');ph.innerHTML=''};
$('phgo').onclick=()=>{try{if(window.AndroidBridge&&window.AndroidBridge.printPage)window.AndroidBridge.printPage();else window.print()}catch(e){alert('تعذر فتح الطباعة')}};
document.body.classList.add('ph-on');ph.scrollTop=0}
function read(k){try{let v=JSON.parse(localStorage.getItem(KEYS[k])||'[]');if(!Array.isArray(v))return[];
 if(k==='q')v=v.filter(p=>p.mode==='q').map(p=>({id:p.id,title:p.name||'أسئلة بدون اسم',updatedAt:p.ts?new Date(p.ts).toLocaleDateString('ar-IQ'):''}));return v}catch(e){return[]}}
function counts(){const m=read('m').length,q=read('q').length;$('cm').textContent=m;$('cq').textContent=q;$('ca').textContent=m+q}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));document.querySelectorAll('.app').forEach(a=>a.classList.remove('on'));$('fab').classList.remove('on')}
function goHome(){show('home');counts()}
const loaded={};
function mount(k){
  if(loaded[k])return loaded[k];
  const host=$('app-'+k),src=JSON.parse($('src-'+k).textContent);
  loaded[k]=new Promise(res=>{
    if(!src){host.innerHTML='<div class="miss"><div><h2>قسم الأسئلة ما انضاف بعد</h2><p>ارسل ملف index.html الكامل لتطبيق الأسئلة حتى ينربط هنا.</p></div></div>';res(null);return}
    const f=document.createElement('iframe');f.setAttribute('allow','clipboard-write; fullscreen; web-share');
    f.onload=()=>setTimeout(()=>res(f.contentWindow),150);host.appendChild(f);f.srcdoc=src;
  });
  return loaded[k];
}
async function openApp(k,id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.querySelectorAll('.app').forEach(a=>a.classList.toggle('on',a.id==='app-'+k));
  $('fab').classList.remove('on');
  const w=await mount(k);
  if(!w)return;
  try{
    if(k==='m'){ if(id&&w.openProject)w.openProject(id); else if(w.exitToHome)w.exitToHome(); }
    else { if(id&&w.openPaper)w.openPaper(id); else w.eval('home()'); }
  }catch(e){}
}
function showProjects(){
  const all=['m','q'].flatMap(k=>read(k).map(p=>({k,id:p.id,t:p.title||p.name||'بدون عنوان',d:p.updatedAt||''})));
  $('plist').innerHTML=all.length?'':'<div class="empty">ما عندك مشاريع محفوظة لحد الآن.</div>';
  all.forEach(p=>{const b=document.createElement('button');b.className='pr';b.style.setProperty('--c',COL[p.k]);b.style.setProperty('--ic',ICC[p.k]);
    b.innerHTML='<span class="tag"></span><b></b><small></small>';
    b.children[0].textContent=NAMES[p.k];b.children[1].textContent=p.t;b.children[2].textContent=p.d?'آخر تعديل: '+p.d:'';
    b.onclick=()=>openApp(p.k,p.id);$('plist').appendChild(b)});
  show('projects');
}
/* الأندرويد يستدعي handleImportedText في الصفحة الرئيسية، فنمرّرها للتطبيق المفتوح داخل الإطار */
function handleImportedText(t){document.querySelectorAll('.app.on iframe').forEach(f=>{try{f.contentWindow.handleImportedText&&f.contentWindow.handleImportedText(t)}catch(e){}})}
/* زر ورقة (الهوم) يظهر فقط بالقائمة الرئيسية للملزمة أو الأسئلة، ويختفي داخل المشروع لأن بي زر رجوع */
function appAtHome(k){
  try{
    const f=$('app-'+k).querySelector('iframe');
    if(!f)return true;
    const d=f.contentDocument,w=f.contentWindow;
    const el=d&&d.getElementById(k==='m'?'home-view':'start');
    if(!el)return false;
    return w.getComputedStyle(el).display!=='none';
  }catch(e){return false}
}
function syncFab(){
  const a=document.querySelector('.app.on');
  $('fab').classList.toggle('on',!!a&&appAtHome(a.id.slice(4)));
}
setInterval(syncFab,250);
window.addEventListener('storage',counts);counts();
</script>
