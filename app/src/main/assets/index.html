<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورقة امتحان</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Almarai:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{--bg:#f4f1ea;--sf:#fff;--tx:#1d2a2a;--mu:#6b7776;--ac:#0f6e5c;--bd:#d9d4c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a19;--sf:#1e2726;--tx:#e8efee;--mu:#8fa09e;--ac:#3fbfa5;--bd:#324140}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
.tabs{display:flex;gap:6px;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font:inherit;font-weight:700}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 10px 10px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input,textarea,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px}
textarea{min-height:84px;resize:vertical}
.q{border:1px dashed var(--bd);border-radius:10px;padding:8px;margin-bottom:8px}
.qh{display:flex;gap:8px;align-items:end;margin-bottom:6px}
.qh div{flex:1}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:#fff;font:inherit;font-weight:700}
.btn.o{background:transparent;color:var(--ac)}
.btn.x{border-color:#c0392b;color:#c0392b;background:transparent;padding:8px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--mu);line-height:1.6}
#prev{display:none;padding:0 0 20px;overflow-x:hidden}
#wrap{margin:0 auto}
#paper{width:794px;min-height:1123px;background:#fff;color:#000;padding:22px 48px 28px;font-family:"Noto Naskh Arabic","Traditional Arabic",Tahoma,serif;font-size:18px;line-height:1.7;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.25);transform-origin:top center}
#paper.one{height:1123px}
.hd{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
.hd img{max-height:70px;max-width:90px}
.hd .c{text-align:center;font-weight:700}
.meta{display:flex;justify-content:space-between;font-size:.9em}
.qt{margin:10px 0}
.qt b.n{margin-inline-end:6px}
.mk{float:left;font-weight:700;border:1px solid #000;padding:0 8px;border-radius:4px;font-size:.9em}
.sub{margin:2px 28px 2px 0}
.hd{grid-template-columns:1fr 1.3fr 1fr;align-items:start;border-bottom:1px solid #000;padding-bottom:26px;margin-bottom:30px}.hd .c{font-weight:inherit}.hd .l,.hd .r{text-align:right}.hd .l{justify-self:end}.qt{margin:0;padding:6px 0 18px;border-bottom:1px solid #000}.qh2{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.mk{float:none;border:0;padding:0;font-weight:inherit;white-space:nowrap}.it{margin:2px 28px 2px 0}.ft{display:grid;grid-template-columns:1fr 1fr;row-gap:28px;margin-top:30px}.tc{text-align:center}.tc:first-child{justify-self:start}.tc:last-child{justify-self:end}.wish{grid-column:1/3;order:3;text-align:center}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 3px;font-size:.9em;direction:ltr}
.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:1px solid #000}
@media print{body{background:#fff}.tabs,#ed,.noprint{display:none!important}#prev{display:block!important;padding:0}#wrap{height:auto!important}#paper{zoom:1!important;transform:none!important;box-shadow:none;margin:0;width:100%}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="tabs"><button id="t1" class="on">✏️ تحرير</button><button id="t2">👁 معاينة</button></div>

<div id="ed">
<div class="card"><h3>معلومات الورقة</h3>
<div class="grid">
<div style="grid-column:1/3"><label>اسم المدرسة (يمين الورقة)</label><input id="school" value="ادارة مدرسة ابو ذر الغفاري الابتدائية للبنات"></div>
<div style="grid-column:1/3"><label>عنوان الامتحان (وسط الورقة)</label><input id="kind" value="اسئلة امتحان الشهر الثاني /الفصل الثاني"></div>
<div><label>العام الدراسي</label><input id="year" value="٢٠٢٥-٢٠٢٦"></div>
<div><label>الزمن (اختياري)</label><input id="time"></div>
<div><label>المادة</label><input id="subj" value="الاجتماعيات"></div>
<div><label>الصف</label><input id="grade" value="الخامس"></div>
<div><label>صفة المعلم (يسار الورقة)</label><input id="teachl" value="معلمة المادة"></div>
<div><label>اسم المعلم (يسار)</label><input id="teacher" value="رسل محمد حمود"></div>
<div><label>صفة معلم ثاني (يمين الورقة)</label><input id="teachl2"></div>
<div><label>اسم المعلم الثاني (يمين)</label><input id="teacher2"></div>
<div style="grid-column:1/3"><label>عبارة نهاية الورقة</label><input id="wish" value="مع تمنياتي لكن بالنجاح والتوفيق"></div>
</div>
<div class="row" style="margin-top:8px"><label style="margin:0">شعار المدرسة:</label><input type="file" id="logo" accept="image/*" style="flex:1"></div>
</div>

<div class="card"><h3>الخطوط</h3><div id="fonts"></div></div>
<div class="card"><h3>الخطوط الفاصلة والمسافات</h3><div class="grid">
<div><label>الخط تحت الترويسة</label><select id="hl"><option value="1px solid #000">عادي</option><option value="2px solid #000">سميك</option><option value="1px dotted #000">منقط</option><option value="0">بدون</option></select></div>
<div><label>الخطوط بين الأسئلة</label><select id="ql"><option value="1px solid #000">عادية</option><option value="2px solid #000">سميكة</option><option value="1px dotted #000">منقطة</option><option value="0">بدون</option></select></div>
<div style="grid-column:1/3"><label>المسافة بين الأسئلة (قلّلها إذا الأسئلة كثيرة)</label><select id="qsp"><option value="0">واسعة</option><option value="1">متوسطة</option><option value="2">ضيقة</option><option value="3">ملاصقة</option></select></div>
</div></div>
<div class="card"><h3>الأسئلة</h3>
<div id="qs"></div>
<div class="row"><button class="btn o" id="add">+ سؤال جديد</button><label style="margin:0"><input type="checkbox" id="one" style="width:auto"> صفحة واحدة (ضبط الخط تلقائياً)</label></div>
<p class="hint">اكتب كل فقرة بسطر جديد. السطر اللي يبدي بـ ‎-‎ يصير فقرة مرقمة (١، ٢، ٣)، وأول سطر هو نص السؤال. الكسور: اكتب ‎{1/2}‎ ويطلع كسر.</p>
</div>
<div class="card row"><button class="btn" id="go">معاينة وطباعة</button></div>
</div>

<div id="prev">
<div class="row noprint" style="padding:0 10px 10px"><button class="btn" id="bpdf">⬇ PDF</button><button class="btn" id="bdoc">⬇ Word</button><button class="btn o" id="pr">🖨 طباعة</button></div>
<div id="wrap"><div id="paper"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const FO=[["'Noto Naskh Arabic',serif",'نسخ'],["'Amiri',serif",'أميري'],["'Scheherazade New',serif",'شهرزاد'],["'Cairo',sans-serif",'القاهرة'],["'Tajawal',sans-serif",'تجوال'],["'Almarai',sans-serif",'المراعي'],['Tahoma,sans-serif','Tahoma']],WO=[['400','عادي'],['500','متوسط'],['600','عريض'],['700','سميك']];
[['H','الترويسة (المدرسة، العنوان، السنة، المادة، الصف، الوقت)'],['Q','الأسئلة'],['W','عبارة نهاية الأسئلة'],['T','صفة المعلم واسمه']].forEach(a=>{const d=document.createElement('div');d.style.marginBottom='10px';

const p=$('paper');p.innerHTML=h;p.className=$('one').checked?'one':'';p.style.fontSize='22px';
if($('one').checked){let s=22;while(p.scrollHeight>p.clientHeight+1&&s>7){s-=.5;p.style.fontSize=s+'px'}}

function buildOld(){const v=k=>esc($(k).value);

function fit(){const z=Math.min(1,(innerWidth-16)/794),p=$('paper');p.style.zoom=z;$('wrap').style.width=(794*z)+'px'}
addEventListener('resize',fit);

$('t1').onclick=()=>tab(1);$('t2').onclick=$('go').onclick=()=>tab(2);
$('add').onclick=()=>{qs.push({t:'',m:''});renderQs();save()};
$('pr').onclick=()=>{try{window.print()}catch(e){alert('افتح الصفحة بالمتصفح واختر طباعة')}};
$('logo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{logo=r.result;save()};r.readAsDataURL(f)};
F.forEach(k=>$(k).addEventListener('input',save));$('one').onchange=save;
async function dl(n,b){if(window.Android){const r=new FileReader();r.onload=()=>Android.save(n,String(r.result).split(',')[1]);r.readAsDataURL(b);return}try{const d=window.claude?await claude.use('downloads'):null;if(d){await d.save({filename:n,data:b});return}}catch(e){if(e&&e.code==='declined')return}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()}
